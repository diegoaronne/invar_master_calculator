<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}INVAR Master Calculator{% endblock %}</title>
    <link rel="stylesheet" href="/static/styles.css">

<body>

            <a href="/hoja">Presupuesto</a>

        {% block contenido %}{% endblock %}
    </main>
</body>
</html>
